<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual1 - Interactive Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
            font-size: 14px;
        }
        
        button {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #666;
        }
    </style>
</head>
<body>
	<canvas id="myCanvas" width="1300" height="800"></canvas>
    <div id="controls">
        <div>Visual1 - Interactive Visualization</div>
        <button id="startBtn" onclick="visualInstance.paint()">Repaint</button>
    </div>
    
    <script src="visual1.js"></script>
    
    <script>
        let visualInstance = new Visual1();
        
        window.addEventListener('DOMContentLoaded', () => {
			console.log("DOMContentLoaded");
			visualInstance.paint();
        });
                
    </script>
</body>
</html>
